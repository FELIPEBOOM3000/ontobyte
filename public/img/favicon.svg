    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#obFavGradient)"/>
  <circle cx="32" cy="32" r="15" fill="none" stroke="#0F172A" stroke-width="7"/>
</svg>